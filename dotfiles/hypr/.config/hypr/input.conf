
source = ~/.config/hypr/programs.conf

# INPUT

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = se

    follow_mouse = 2
  
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 2, horizontal, workspace


# KEYBINDINGS

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = SUPER, C, exec, $terminal
bind = SUPER, E, exec, $fileManager
# bind = SUPER, SPACE, exec, $menu
bind = SUPER, B, exec, $browser

bind = SUPER, P, pseudo, # dwindle
bind = SUPER, J, togglesplit, # dwindle
bind = SUPER, F, togglefloating,

bind = SUPER, Q, exec, ~/.config/hypr/scripts/close.sh
bind = SUPER, M, exit,

bind = SUPER, space, exec, dms ipc call spotlight toggle
bind = SUPER, V, exec, dms ipc call clipboard toggle
bind = SUPER, TAB, exec, dms ipc call hypr toggleOverview
bind = SUPER, K, exec, dms ipc call keybinds toggle hyrpland
bind = SUPER, N, exec, dms ipc call notepad open
bind = CTRL ALT, DELETE, exec, dms ipc powermenu toggle


# Security
bind = SUPER ALT, L, exec, dms ipc call lock lock

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Swap position of windows with mainMod + arrow keys
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Resize windows with mainMod + arrow keys
binde = SUPER CTRL, left, resizeactive, -20 0
binde = SUPER CTRL, right, resizeactive, 20 0
binde = SUPER CTRL, up, resizeactive, 0 -20
binde = SUPER CTRL, down, resizeactive, 0 20

# Switch workspaces with mainMod + [-1-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8 
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [-1-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, Magic
bind = SUPER SHIFT, S, movetoworkspace, special:Magic

bind = SUPER, G, togglespecialworkspace, Gaming
bind = SUPER SHIFT, G, movetoworkspace, special:Gaming

# Scroll through workspaces with mainMod + scroll
binds:scroll_event_delay = 0

bind = SUPER, mouse_up, workspace, r-1
bind = SUPER, mouse_down, workspace, r+1

bind = SUPER ALT, left, workspace, r-1
bind = SUPER ALT, right, workspace, r+1

# Move/resize windows with mainMod + LMB/RMB and dragging
# 272 = LMB, 273 = RMB, 274 = MMB
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



# Screenshot a window
bind = SUPER, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = SUPER SHIFT, PRINT, exec, hyprshot -m region
